
name: llvm.opt
property:
  # dependency versions: master on master, latest on latest (a bare dep is the default branch)
  mkn.mod.version: latest
version: master

parent: base
src: mod.cpp
mode: shared
if_arg:
    shared: -DMKN_KUL_SHARED

profile:
- name: base
  dep: mkn.mod#${mkn.mod.version}

- name: format
  mod: |
    clang.format#latest{init{style: google, paths: .}}

- name: test
  parent: base
  mod: llvm.opt#latest
  src: mod.cpp
